<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: an exam answer sheet (پاسخ‌برگ) turned into a daily planner — dropout-ink rules,
   pencil-filled bubbles for finished tasks; one centered column, max 1000px. */
:root {
  --paper: #fbfbfa;
  --sheet: #ffffff;
  --tint: #fbedf1;
  --ink: #1c1d21;
  --ink-2: #52535c;
  --ink-3: #85868f;
  --drop: #c22e5a;
  --drop-line: #efbccb;
  --on-drop: #ffffff;
  --pencil: #2a2b31;
  --ok: #26734f;
  --warn: #9a6200;
  --c-hoosh: #c22e5a;
  --c-riazi: #245fa3;
  --c-olum: #2a744c;
  --c-farsi: #9d5317;
  --c-motaleat: #6c5838;
  --c-payam: #67489b;
  --c-arabi: #73661a;
  --c-misc: #64656e;
  --display: "Lalezar", "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  --body: "Vazirmatn", Tahoma, "Segoe UI", "Noto Sans Arabic", sans-serif;
  --gut: clamp(16px, 4vw, 32px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131417; --sheet: #1b1c20; --tint: #2b1a21; --ink: #ecebef; --ink-2: #b6b5bd; --ink-3: #8a8992;
    --drop: #ef6b91; --drop-line: #5b3140; --on-drop: #1c0b12; --pencil: #e2e1e6; --ok: #62c79a; --warn: #e4a947;
    --c-hoosh: #ef6b91; --c-riazi: #7cabe9; --c-olum: #6fc697; --c-farsi: #e5a067; --c-motaleat: #cbb083; --c-payam: #b195e6; --c-arabi: #d0c266; --c-misc: #a8a7b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131417; --sheet: #1b1c20; --tint: #2b1a21; --ink: #ecebef; --ink-2: #b6b5bd; --ink-3: #8a8992;
  --drop: #ef6b91; --drop-line: #5b3140; --on-drop: #1c0b12; --pencil: #e2e1e6; --ok: #62c79a; --warn: #e4a947;
  --c-hoosh: #ef6b91; --c-riazi: #7cabe9; --c-olum: #6fc697; --c-farsi: #e5a067; --c-motaleat: #cbb083; --c-payam: #b195e6; --c-arabi: #d0c266; --c-misc: #a8a7b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 1000px; margin-inline: auto; padding-inline: var(--gut); padding-block: 18px 80px; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.eyebrow { font-size: 13px; color: var(--drop); font-weight: 600; margin: 0 0 2px; }
.c-hoosh { color: var(--c-hoosh); } .c-riazi { color: var(--c-riazi); } .c-olum { color: var(--c-olum); } .c-farsi { color: var(--c-farsi); }
.c-motaleat { color: var(--c-motaleat); } .c-payam { color: var(--c-payam); } .c-arabi { color: var(--c-arabi); } .c-misc { color: var(--c-misc); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 28px; padding-block: 6px 16px; border-bottom: 2px solid var(--drop); }
.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6.4vw, 48px); line-height: 1.15; margin: 0; }
.top h1 .yr { color: var(--drop); }
.top .sub { margin-top: 4px; color: var(--ink-2); font-size: 14px; }
.count { display: flex; align-items: center; gap: 12px; min-width: 0; }
.digits { display: flex; gap: 4px; direction: ltr; }
.digits span { width: 34px; height: 44px; border: 1.5px solid var(--drop); border-radius: 6px; display: grid; place-items: center; font-family: var(--display); font-size: 27px; line-height: 1; padding-top: 4px; background: var(--sheet); }
.count b { display: block; font-size: 15px; }
.count small { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-block: 10px 6px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.pill.ok::before { background: var(--ok); } .pill.warn::before { background: var(--warn); }

.btn { border: 1.5px solid var(--drop-line); background: var(--sheet); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; line-height: 1.6; }
.btn:hover { border-color: var(--drop); }
.btn.sm { padding: 3px 10px; font-size: 13px; }
.btn.primary { background: var(--drop); border-color: var(--drop); color: var(--on-drop); font-weight: 600; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn:focus-visible, .tab:focus-visible, .sd:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--drop); outline-offset: 2px; }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--drop-line); margin-inline: calc(-1 * var(--gut)); padding-inline: var(--gut); margin-bottom: 18px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 11px 12px 9px; font-size: 15px; color: var(--ink-2); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--drop); font-weight: 700; }
@media (max-width: 480px) { .tab { padding-inline: 8px; font-size: 14px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sr-h { font-size: 20px; margin: 0 0 10px; }

/* answer rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: start; width: 100%; text-align: start; background: none; border: 0;
  border-top: 1px dashed var(--drop-line); padding: 12px 2px; cursor: pointer; border-radius: 0; }
.row:first-child { border-top: 0; }
.row:focus-visible { outline: 2px solid var(--drop); outline-offset: -2px; border-radius: 6px; }
.row[aria-disabled="true"] { cursor: default; }
.bub { width: 32px; height: 21px; border: 1.6px solid var(--drop); border-radius: 50%; display: grid; place-items: center; margin-top: 4px; position: relative; overflow: hidden; }
.bub i { font-style: normal; font-size: 11px; line-height: 1; color: var(--drop); }
.bub::after { content: ""; position: absolute; inset: 0; background: var(--pencil);
  background: repeating-linear-gradient(-32deg, var(--pencil) 0 2px, color-mix(in srgb, var(--pencil) 74%, transparent) 2px 3.2px);
  transform: scale(0); border-radius: 50%; transition: transform .18s ease-out; }
.row[aria-checked="true"] .bub { border-color: var(--pencil); }
.row[aria-checked="true"] .bub::after { transform: scale(1.15); }
.row:hover .bub { box-shadow: 0 0 0 3px var(--tint); }
.tx { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.meta b { font-weight: 700; font-size: 13px; }
.tt { display: block; font-size: 15px; color: var(--ink); }
.row[aria-checked="true"] .tt { color: var(--ink-3); }
.row.compact { padding: 9px 0; gap: 2px 10px; }
.row.compact .tt { font-size: 14px; line-height: 1.65; }
.row.compact .bub { width: 28px; height: 19px; margin-top: 3px; }

/* today */
.daysheet { background: var(--sheet); border: 1px solid var(--drop-line); border-radius: 12px; padding: 4px 18px 12px; }
.dayhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 16px; padding-block: 14px 10px; border-bottom: 1.5px solid var(--drop); }
.dayhead h2, .weekhead h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 34px); margin: 0; line-height: 1.25; }
.dnav { display: flex; gap: 6px; align-items: center; }
.dprog { display: grid; grid-template-columns: auto minmax(60px, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); padding-block: 10px 4px; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--tint); overflow: hidden; min-width: 40px; }
.meter i { display: block; height: 100%; background: var(--drop); }
.notes { list-style: none; margin: 8px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--drop-line); display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.notes li::before { content: "◂ "; color: var(--drop); }
.empty { padding: 26px 0 18px; color: var(--ink-2); font-size: 15px; }

.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-block: 14px; }
.sd { border: 1px solid var(--drop-line); border-radius: 8px; padding: 6px 2px 4px; background: var(--sheet); cursor: pointer; display: grid; gap: 3px; justify-items: center; font-size: 13px; line-height: 1.3; color: var(--ink-2); }
.sd .fill { width: 24px; height: 15px; border: 1.4px solid var(--drop); border-radius: 50%; background: linear-gradient(to top, var(--pencil) var(--p), transparent var(--p)); }
.sd .fill.none { border-style: dashed; opacity: .55; }
.sd[aria-current="date"] { border-color: var(--drop); color: var(--ink); font-weight: 700; }
.sd.sel { background: var(--tint); }
.sd[disabled] { visibility: hidden; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--sheet); border: 1px solid var(--drop-line); border-radius: 12px; padding: 14px 18px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 17px; }
.card p + p { margin-top: 8px; }
.tip { font-size: 15px; }
.streak { margin-top: 10px !important; font-size: 13px; color: var(--ink-2); }
.method { margin-top: 12px; }
.method summary { cursor: pointer; font-weight: 600; }
.method dl { margin: 10px 0 0; display: grid; gap: 8px; }
.method dt { font-weight: 700; font-size: 13.5px; }
.method dd { margin: 0; font-size: 14px; color: var(--ink-2); }

/* week */
.weekhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; padding-bottom: 12px; border-bottom: 1.5px solid var(--drop); }
.bigpct { display: grid; justify-items: start; line-height: 1.1; }
.bigpct b { font-family: var(--display); font-weight: 400; font-size: 40px; color: var(--drop); }
.bigpct span { font-size: 13px; color: var(--ink-2); }
.subjs { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-block: 12px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.sbar { display: inline-grid; grid-template-columns: auto auto; gap: 2px 8px; align-items: center; }
.sbar .meter { grid-column: 1 / -1; height: 4px; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.wday { background: var(--sheet); border: 1px solid var(--drop-line); border-radius: 12px; padding: 10px 14px 8px; min-width: 0; }
.wday.today { border-color: var(--drop); box-shadow: inset 0 0 0 1px var(--drop); }
.wday h3 { font-size: 15px; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--drop-line); font-variant-numeric: tabular-nums; }
.wday .tag { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.wday .rest { color: var(--ink-2); font-size: 14px; padding-block: 10px; }

.lock { margin-bottom: 18px; border-color: var(--drop); }
.lock .frow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.report { margin-top: 18px; }
.report textarea { width: 100%; min-height: 110px; border: 1.5px solid var(--drop-line); border-radius: 8px; background: var(--paper); padding: 8px 10px; font-size: 13px; resize: vertical; direction: rtl; }
.report .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }

/* road */
.sec { margin-top: 26px; }
.sec > h2 { font-size: 20px; margin: 0 0 10px; }
.share { display: flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--drop-line); }
.share span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 13.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; vertical-align: middle; }
.tblwrap { overflow-x: auto; margin-top: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px dashed var(--drop-line); text-align: start; white-space: nowrap; }
.tbl th { font-weight: 600; color: var(--ink-2); font-size: 13px; border-bottom: 1.5px solid var(--drop); }
.tbl td.wrap { white-space: normal; }
.gate { border: 1.5px solid var(--drop); background: var(--tint); }
.gate h3 { color: var(--drop); }
.facts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { padding-inline-start: 16px; position: relative; }
.facts li::before { content: ""; position: absolute; inset-inline-start: 0; top: .72em; width: 7px; height: 5px; border: 1.3px solid var(--drop); border-radius: 50%; }
.dates { display: grid; gap: 0; }
.dates > div { display: grid; grid-template-columns: minmax(110px, 150px) minmax(0, 1fr); gap: 4px 16px; padding-block: 10px; border-top: 1px dashed var(--drop-line); }
.dates > div:first-child { border-top: 0; }
.dates b { font-weight: 700; }
.tl { display: grid; gap: 3px; direction: rtl; margin-bottom: 14px; position: relative; padding-top: 18px; }
.tl .seg { height: 14px; border-radius: 3px; background: var(--tint); border: 1px solid var(--drop-line); }
.tl .seg.cur { background: var(--drop); border-color: var(--drop); }
.tl .lab { font-size: 12px; color: var(--ink-3); text-align: center; white-space: nowrap; overflow: hidden; }
.tl .now { position: absolute; top: 0; font-size: 11.5px; color: var(--drop); font-weight: 700; transform: translateX(50%); white-space: nowrap; }
.phases { display: grid; gap: 12px; }
.phase { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 8px 22px; }
.phase.cur { border-color: var(--drop); box-shadow: inset 0 0 0 1px var(--drop); }
.phase .when { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.phase .when b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; color: var(--ink); line-height: 1.3; }
.phase ul { margin: 8px 0 0; padding-inline-start: 18px; font-size: 14px; color: var(--ink-2); }
.phase .pm { margin-top: 10px; display: grid; grid-template-columns: minmax(60px, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 640px) { .phase { grid-template-columns: minmax(0, 1fr); } .dates > div { grid-template-columns: minmax(0, 1fr); } }

/* mocks */
.mform { display: grid; gap: 14px; }
.frow { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.frow label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.inp { border: 1.5px solid var(--drop-line); border-radius: 7px; background: var(--paper); padding: 6px 9px; min-width: 0; }
.inp:focus { outline: 2px solid var(--drop); outline-offset: 0; border-color: var(--drop); }
.inp.num { width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.inp.title { width: min(100%, 300px); }
.mgrid { display: grid; max-width: 520px; grid-template-columns: minmax(0, 1fr) 70px 70px 64px; gap: 6px 10px; align-items: center; font-size: 14px; }
.mgrid .h { font-size: 12.5px; color: var(--ink-3); }
.mgrid .of { font-size: 12.5px; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }
.mgrid .sep { grid-column: 1 / -1; border-top: 1px dashed var(--drop-line); }
.prev { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prev b { color: var(--ink); }
.err { color: var(--drop); font-size: 13.5px; }
.err:empty, .prev:empty { display: none; }
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--ink-3); }
.del { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 13px; padding: 2px 6px; }
.del:hover { color: var(--drop); }

/* books & rules */
.books { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.books h3 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.books h3 small { font-size: 12.5px; color: var(--ink-3); font-weight: 400; }
.item { padding-block: 10px; border-top: 1px dashed var(--drop-line); }
.item:first-of-type { border-top: 0; }
.item .nm { font-weight: 700; }
.item .pb { color: var(--ink-2); font-weight: 400; }
.item p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.prio { display: inline-block; font-size: 12px; border: 1px solid var(--drop-line); border-radius: 999px; padding: 0 9px; margin-inline-end: 6px; color: var(--drop); background: var(--tint); }
.prio.p0 { color: var(--ink-2); background: none; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.rules p, .rules li { font-size: 14.5px; }
.rules ul { margin: 6px 0 0; padding-inline-start: 18px; }

/* settings dialog */
.ovl { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--ink) 38%, transparent); }
.dlg { background: var(--sheet); border: 1px solid var(--drop-line); border-radius: 14px; width: min(100%, 470px); max-height: calc(100% - 32px); overflow: auto; padding: 18px 20px; }
.dlg h2 { margin: 0 0 4px; font-size: 19px; }
.dlg fieldset { border: 0; padding: 0; margin: 16px 0 0; }
.dlg legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
.dlg .hint { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--drop-line); border-radius: 999px; padding: 3px 13px; background: none; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--drop); border-color: var(--drop); color: var(--on-drop); }
.dlg .acts { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; }

/* skins: same layout, different ink. Each skin sets light tokens, then dark tokens with higher specificity. */
:root[data-skin="sea"] { --paper: #f6f2e9; --sheet: #fffdf8; --tint: #e3eef7; --drop: #1d5f9b; --drop-line: #b7d0e6; --on-drop: #ffffff; --glow: #e8833a; }
:root[data-skin="hero"] { --paper: #f4f5f9; --sheet: #ffffff; --tint: #fdeaea; --drop: #c4262e; --drop-line: #efbcbf; --on-drop: #ffffff; --glow: #1f3f8f; }
:root[data-skin="night"] { --paper: #f7f5fc; --sheet: #ffffff; --tint: #eee8fb; --drop: #6a3fc2; --drop-line: #d5c8f2; --on-drop: #ffffff; --glow: #d6458f; }
:root { --glow: #26734f; }
@media (prefers-color-scheme: dark) {
  :root[data-skin="sea"]:not([data-theme="light"]) { --paper: #0d151f; --sheet: #13202e; --tint: #16293b; --drop: #6db1ec; --drop-line: #2a4864; --on-drop: #06121d; --glow: #f0a060; }
  :root[data-skin="hero"]:not([data-theme="light"]) { --paper: #0c1121; --sheet: #141b31; --tint: #2a1520; --drop: #ff6b70; --drop-line: #4c2a36; --on-drop: #1a0507; --glow: #8fb0ff; }
  :root[data-skin="night"]:not([data-theme="light"]) { --paper: #110e1b; --sheet: #1a1627; --tint: #241c39; --drop: #b49dff; --drop-line: #3c305f; --on-drop: #120a24; --glow: #ff8cc6; }
}
:root[data-skin="sea"][data-theme="dark"] { --paper: #0d151f; --sheet: #13202e; --tint: #16293b; --drop: #6db1ec; --drop-line: #2a4864; --on-drop: #06121d; --glow: #f0a060; }
:root[data-skin="hero"][data-theme="dark"] { --paper: #0c1121; --sheet: #141b31; --tint: #2a1520; --drop: #ff6b70; --drop-line: #4c2a36; --on-drop: #1a0507; --glow: #8fb0ff; }

  function mergeDocs(a, b) {

    if (st.p) h += st.p.filter(function (x) { return x; }).map(function (x) { return '<p>' + T(qText(x)) + '</p>'; }).join('');
    if (st.demo) h += '<div class="tdemo"><button type="button" class="row" role="checkbox" aria-checked="' + tourDemo + '" data-act="tour-demo"><span class="bub" aria-hidden="true"><i>۱</i></span>' +
      '<span class="tx"><span class="meta"><b class="c-riazi">ریاضی</b><span>۴۵ دقیقه</span></span><span class="tt">نمونه: تمرین‌های فصل اول</span></span></button></div>';
    if (st.p2) h += st.p2.map(function (x) { return '<p>' + T(qText(x)) + '</p>'; }).join('');
    if (st.list) h += '<ul class="facts">' + st.list.map(function (x) { return '<li>' + T(x) + '</li>'; }).join('') + '</ul>';
    h += '<div class="tdots" aria-hidden="true">' + TOUR.map(function (x, i) { return '<i' + (i === tourStep ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
    h += '<div class="acts">' + '<button type="button" class="btn primary" data-act="tour-next">' + (last ? 'شروع کنیم!' : 'بعدی') + '</button>' +
      (tourStep ? '<button type="button" class="btn" data-act="tour-prev">قبلی</button>' : '') +
      (last ? '' : '<button type="button" class="btn link" data-act="tour-close">رد کردن</button>') + '</div></div>';
    return h;
  }
  function openTour() {
    tourStep = 0; tourDemo = false; LS.set('tourSeen', 1);
    OVL.innerHTML = tourHtml(); OVL.hidden = false;
    var b = OVL.querySelector('[data-act="tour-next"]'); if (b) b.focus();
  }
  function tourGo(d) {
    tourStep = Math.max(0, Math.min(TOUR.length - 1, tourStep + d));
    OVL.innerHTML = tourHtml();
    var b = OVL.querySelector('[data-act="tour-next"]'); if (b) b.focus();
  }
  function maybeTour() { if (GH.token && !LS.get('tourSeen', 0) && OVL.hidden) openTour(); }

  /* ---------- render & inputs ---------- */
  function capture() {
    var keep = { v: {}, open: {} };
    Array.prototype.forEach.call(VIEW.querySelectorAll('input[id], select[id], textarea[id]'), function (el) { keep.v[el.id] = el.value; });
    Array.prototype.forEach.call(VIEW.querySelectorAll('details[data-k]'), function (el) { keep.open[el.dataset.k] = el.open; });
    var a = document.activeElement; keep.focus = a && VIEW.contains(a) && a.id ? a.id : null;
    return keep;
  }
  function restore(keep, sameView) {
    if (!sameView) return;
    Object.keys(keep.v).forEach(function (id) { var el = document.getElementById(id); if (el && el.tagName !== 'BUTTON') el.value = keep.v[id]; });
    Object.keys(keep.open).forEach(function (k) { var el = VIEW.querySelector('details[data-k="' + k + '"]'); if (el) el.open = keep.open[k]; });
    if (keep.focus) { var f = document.getElementById(keep.focus); if (f) f.focus({ preventScroll: true }); }
    var ex = document.getElementById('exp-text'); if (ex && ex.value) ex.hidden = false;
  }
  var lastView = null;
  function render() {
    if (!S.plan) return;
    renderHeader();
    var keep = capture(), same = lastView === S.view;
    if (S.view === 'today') renderToday();
    else if (S.view === 'week') renderWeek();
    else if (S.view === 'road') renderRoad();
    else if (S.view === 'mocks') renderMocks();
    else if (S.view === 'books') renderBooks();
    else renderRules();
    restore(keep, same);
    lastView = S.view;
    if (S.view === 'mocks') updatePreview();
    if (S.lastFocus) {
      var el = VIEW.querySelector('[data-id="' + S.lastFocus.replace(/"/g, '') + '"]');
      if (el) el.focus({ preventScroll: true });
      S.lastFocus = null;
    }
  }
  function setView(v) {
    if (VIEWS.indexOf(v) < 0) v = 'today';
    S.view = v; LS.set('view', v);
    try { history.replaceState(null, '', '#' + v); } catch (e) { /* not allowed here */ }
    render();
    window.scrollTo({ top: 0 });
  }
  var toastTimer = null;
  function toast(msg, by, ms) {
    var el = $('#toast'); el.innerHTML = T(msg) + (by ? '<small>' + T(by) + '</small>' : ''); el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 2600);
  }

  async function logout() {
    if (GH.token) { clearTimeout(GH.timer); while (GH.busy) await sleep(200); await sync(); }
    if (S.status !== 'ok' && S.status !== 'auth') { toast('هنوز همه‌چیز ذخیره نشده؛ وقتی اینترنت وصل شد دوباره امتحان کن'); return; }
    LS.del('tok'); LS.del('acct'); LS.del('doc'); GH.token = null; GH.cfg = null; DOC = emptyDoc(); REV++;
    S.settings = normSettings(null); applySkin(); rebuild();
    closeSettings(); S.status = 'init'; S.cursor = null; render();
    $('#lg-pw').value = ''; $('#lg-err').textContent = ''; showApp(false); window.scrollTo({ top: 0 }); $('#lg-user').focus();
  }

  /* ---------- events ---------- */
  function handleAct(act, el) {
    var j = clampDay(S.cursor == null ? S.today : S.cursor);
    if (act === 'prev-day') { S.cursor = clampDay(j - 1); render(); }
    else if (act === 'next-day') { S.cursor = clampDay(j + 1); render(); }
    else if (act === 'today') { S.cursor = null; render(); }
    else if (act === 'prev-week') { S.week = Math.max(0, S.week - 1); render(); }
    else if (act === 'next-week') { S.week = Math.min(lastWeek(), S.week + 1); render(); }
    else if (act === 'this-week') { S.week = null; render(); }
    else if (act === 'settings') openSettings();
    else if (act === 'close-settings') closeSettings();
    else if (act === 'save-settings') saveSettings();
    else if (act === 'lock') logout();
    else if (act === 'tour') openTour();
    else if (act === 'tour-next') { if (tourStep === TOUR.length - 1) { closeSettings(); toast('موفق باشی، ' + S.settings.name + '!'); } else tourGo(1); }
    else if (act === 'tour-prev') tourGo(-1);
    else if (act === 'tour-close') closeSettings();
    else if (act === 'tour-demo') { tourDemo = !tourDemo; el.setAttribute('aria-checked', String(tourDemo)); if (tourDemo) toast('آفرین! همین‌طوری.'); }
    else if (act === 'del-mock') {
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'مطمئنی؟'; setTimeout(function () { if (el.isConnected) { el.dataset.confirm = ''; el.textContent = 'حذف'; } }, 3000); return; }
      deleteMock(el.dataset.mid);
    }
  }
  document.addEventListener('click', function (e) {
    var row = e.target.closest('.row[data-id]');
    if (row && VIEW.contains(row)) {
      if (row.getAttribute('aria-disabled') === 'true') { toast('این مورد را پشتیبان ثبت کرده'); return; }
      S.lastFocus = row.dataset.id; toggle(row.dataset.id); return;
    }
    var chip = e.target.closest('.chip[data-wd]');
    if (chip && OVL.contains(chip)) {
      var on = chip.getAttribute('aria-pressed') === 'true';
      if (!on && OVL.querySelectorAll('.chip[data-wd][aria-pressed="true"]').length >= 2) { $('#set-err', OVL).textContent = 'حداکثر دو روز کلاس زبان را انتخاب کن.'; return; }
      chip.setAttribute('aria-pressed', String(!on)); $('#set-err', OVL).textContent = ''; return;
    }
    var skc = e.target.closest('.chip.skin');
    if (skc && OVL.contains(skc)) {
      Array.prototype.forEach.call(OVL.querySelectorAll('.chip.skin'), function (b) { b.setAttribute('aria-pressed', String(b === skc)); });
      document.documentElement.setAttribute('data-skin', skc.dataset.skin); return;
    }
    var go = e.target.closest('[data-go]');
    if (go) { S.cursor = +go.dataset.go; render(); return; }
    var act = e.target.closest('[data-act]');
    if (act && !act.disabled) { handleAct(act.dataset.act, act); return; }
    var tab = e.target.closest('.tab');
    if (tab) { setView(tab.dataset.view); return; }
    if (e.target === OVL) closeSettings();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !OVL.hidden) closeSettings();
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.classList && e.target.classList.contains('tab')) {
      var i = VIEWS.indexOf(e.target.dataset.view), n = VIEWS[(i + (e.key === 'ArrowLeft' ? 1 : VIEWS.length - 1)) % VIEWS.length];
      setView(n); var t = document.querySelector('.tab[data-view="' + n + '"]'); if (t) t.focus();
    }
  });
  VIEW.addEventListener('input', function (e) { if (e.target.closest('#mform')) updatePreview(); });
  VIEW.addEventListener('submit', function (e) {
    if (e.target.id !== 'mform') return;
    e.preventDefault();
    var r = readForm(), errEl = $('#m-err');
    if (r.err) { errEl.textContent = fa(r.err); return; }
    errEl.textContent = '';
    var v = cleanMock(r.m); if (!v) { errEl.textContent = 'اطلاعات آزمون کامل نیست.'; return; }
    addMock(v);
    e.target.reset();
    var jj = P.d2j(S.today); $('#m-d').value = jj.jd; $('#m-m').value = jj.jm; $('#m-y').value = jj.jy;
    toast('آزمون ذخیره شد'); render();
  });

  $('#lg-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('#lg-user').value.trim(), pw = $('#lg-pw').value, er = $('#lg-err'), btn = $('#lg-form button');
    if (!u || !pw) { er.textContent = 'نام کاربری و رمز را وارد کن.'; return; }
    er.textContent = ''; btn.disabled = true; btn.textContent = 'در حال ورود…';
    login(u, pw).then(function () { toast('خوش اومدی، ' + S.settings.name + '!'); }, function (err) {
      er.textContent = err && err.net ? 'اتصال به اینترنت برقرار نشد. دوباره امتحان کن.' : 'نام کاربری یا رمز درست نیست.';
      $('#lg-pw').select();
    }).then(function () { btn.disabled = false; btn.textContent = 'ورود'; });
  });

  /* ---------- start ---------- */
  rebuild();
  var hv = (location.hash || '').replace('#', '');
  S.view = VIEWS.indexOf(hv) >= 0 ? hv : (VIEWS.indexOf(LS.get('view', 'today')) >= 0 ? LS.get('view', 'today') : 'today');
  document.documentElement.lang = 'fa';
  if (DOC.settings) { S.settings = normSettings(DOC.settings); rebuild(); }
  applySkin();
  fetch('quotes.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (q) {
    if (q && typeof q === 'object' && Array.isArray(q.start)) { QUOTES = q; render(); }
  }).catch(function () { /* keep built-in quotes */ });
  render();
  startSync();
  setInterval(function () { var t = tehranToday(); if (t !== S.today) { S.today = t; render(); } }, 60000);
  setInterval(function () { if (!document.hidden && GH.token) sync(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (GH.token) sync(); });
  window.addEventListener('online', function () { if (GH.token) sync(); });
})();

</script>

</body>
