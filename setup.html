<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>راه‌اندازی برنامه</title>
<style>
:root { --bg:#fbfbfa; --card:#fff; --ink:#1c1d21; --mut:#5d6068; --line:#e3c6cf; --acc:#b0284f; --ok:#1f7a4d; --bad:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --card:#1f2024; --ink:#ececee; --mut:#a5a7ad; --line:#4a3a40; --acc:#ec7a9b; --ok:#6fcf97; --bad:#ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.8 Vazirmatn, Tahoma, system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
label { display: block; margin-top: 12px; font-weight: 600; }
input, textarea { width: 100%; margin-top: 4px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
input[dir=ltr], textarea { direction: ltr; text-align: left; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
textarea { min-height: 150px; }
button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--acc); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
button.sec { background: transparent; color: var(--acc); border: 1.5px solid var(--acc); }
.mut { color: var(--mut); font-size: 13px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>راه‌اندازی ذخیره در گیت‌هاب</h1>
  <p class="mut">این صفحه کلید دسترسی (توکن) را با رمزی که انتخاب می‌کنید قفل می‌کند. کلید خام هیچ‌جا ذخیره یا فرستاده نمی‌شود؛ فقط نسخهٔ قفل‌شده را خروجی می‌گیرید.</p>

  <form class="card" id="f" novalidate>
    <label>صاحب مخزن داده (نام کاربری گیت‌هاب)<input id="owner" dir="ltr" autocomplete="off"></label>
    <label>نام مخزن داده<input id="repo" dir="ltr" value="tizhooshan-data" autocomplete="off"></label>
    <label>نام کاربری (انگلیسی، مثلاً mina)<input id="user" dir="ltr" autocomplete="off" autocapitalize="off"></label>
    <label>اسم فایل داده<input id="path" dir="ltr" value="data.json" autocomplete="off"></label>
    <label>توکن (Fine-grained token)<input id="tok" dir="ltr" type="password" autocomplete="off" placeholder="github_pat_..."></label>
    <label>رمز برنامه (حداقل ۸ حرف)<input id="pw" type="password" autocomplete="new-password"></label>
    <label>تکرار رمز<input id="pw2" type="password" autocomplete="new-password"></label>
    <button type="submit">بررسی و قفل کردن</button>
    <p id="msg" role="alert"></p>
  </form>

  <section class="card" id="outbox" hidden>
    <p class="ok">آماده است. متن زیر را کامل کپی کنید و برای Claude بفرستید تا به‌عنوان <code>config.json</code> در سایت قرار بگیرد.</p>
    <textarea id="out" readonly></textarea>
    <button type="button" class="sec" id="copy">کپی</button>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var h = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if (h) $('owner').value = h[1];
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function say(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }
  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var owner = $('owner').value.trim(), repo = $('repo').value.trim(), tok = $('tok').value.trim(), pw = $('pw').value;
    var user = $('user').value.trim().toLowerCase(), path = $('path').value.trim() || 'data.json';
    if (!owner || !repo || !tok || !user) return say('همهٔ خانه‌ها را پر کنید.', 'bad');
    if (!/^[a-z0-9._-]{2,30}$/.test(user)) return say('نام کاربری فقط حروف انگلیسی و عدد باشد.', 'bad');
    if (pw.length < 8) return say('رمز باید حداقل ۸ حرف باشد.', 'bad');
    if (pw !== $('pw2').value) return say('رمز و تکرارش یکی نیستند.', 'bad');
    say('در حال بررسی توکن…');
    try {
      var r = await fetch('https://api.github.com/repos/' + owner + '/' + repo, { headers: { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' } });
      if (r.status === 401) return say('توکن معتبر نیست.', 'bad');
      if (r.status === 404) return say('مخزن پیدا نشد یا توکن به آن دسترسی ندارد.', 'bad');
      var j = await r.json();
      if (!j.private) return say('این مخزن عمومی است. مخزن داده باید Private باشد.', 'bad');
      if (!j.permissions || !j.permissions.push) return say('توکن اجازهٔ نوشتن ندارد. در تنظیمات توکن، Contents را روی Read and write بگذارید.', 'bad');
    } catch (err) { return say('اتصال به گیت‌هاب برقرار نشد.', 'bad'); }
    say('در حال قفل کردن…');
    var iter = 310000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
    var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(tok)));
    var cfg = { owner: owner, users: {} };
    cfg.users[user] = { repo: repo, path: path, iter: iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
    $('out').value = JSON.stringify(cfg, null, 2);
    $('outbox').hidden = false; $('tok').value = ''; $('pw').value = ''; $('pw2').value = '';
    say('توکن درست کار می‌کند.', 'ok');
  });
  $('copy').addEventListener('click', function () {
    var t = $('out'); t.select();
    try { navigator.clipboard.writeText(t.value).then(function () { $('copy').textContent = 'کپی شد'; }); } catch (e) { document.execCommand('copy'); }
  });
})();
</script>
</body>
</html>
